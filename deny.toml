# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# "Unmaintained" notices (not vulnerabilities) for crates we only get
# transitively, on Linux, through Tauri's GTK stack and the keyring crate's
# Secret Service backend. Revisit when those upstreams move off them.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: build-time macro dep of gtk-rs via Tauri (Linux only)" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant: D-Bus via keyring's Linux secret-service backend" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: D-Bus via keyring's Linux secret-service backend" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: D-Bus via keyring's Linux secret-service backend" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "Unlicense",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
