[package]
name = "agasthy-desktop"
description = "AGASTHY desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "agasthy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
agasthy-core.workspace = true
agasthy-platform.workspace = true
agasthy-discovery.workspace = true
agasthy-system-monitor.workspace = true
agasthy-graph.workspace = true
agasthy-process.workspace = true
agasthy-cleanup.workspace = true
agasthy-actions.workspace = true
agasthy-snapshots.workspace = true
agasthy-security.workspace = true
agasthy-update-lab.workspace = true
agasthy-ai.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs.workspace = true
sysinfo.workspace = true
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
