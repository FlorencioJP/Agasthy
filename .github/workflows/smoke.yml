name: End-to-end smoke test

# Installs the published files of a release (draft or not) on real macOS,
# Windows and Linux runners, launches the app and checks that it started,
# and runs the released command-line tool on each OS against a real Git repo.
#
#   gh workflow run smoke.yml -f tag=v0.1.3

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to test (e.g. v0.1.3)
        required: true

permissions:
  # Draft releases are only visible to tokens that can write to the repository.
  # Nothing in this workflow writes anything.
  contents: write

env:
  TAG: ${{ inputs.tag }}
  GH_TOKEN: ${{ github.token }}

jobs:
  macos-app:
    name: macOS app (DMG)
    runs-on: macos-latest
    steps:
      - name: Download the DMG from the release
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*apple-silicon.dmg*"
          shasum -a 256 -c *.dmg.sha256
      - name: Install from the DMG
        run: |
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" *.dmg
          cp -R "$mnt/AGASTHY.app" "$RUNNER_TEMP/"
          hdiutil detach "$mnt"
      - name: Signature is complete (no "damaged" error after a browser download)
        run: |
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/AGASTHY.app"
          codesign -dv "$RUNNER_TEMP/AGASTHY.app" 2>&1 | grep -E "Signature|Sealed Resources"
      - name: Launch and check it started
        run: |
          app="$RUNNER_TEMP/AGASTHY.app/Contents/MacOS/agasthy-desktop"
          "$app" > "$RUNNER_TEMP/out.log" 2>&1 &
          pid=$!
          sleep 30
          kill -0 "$pid" || { echo "app exited early"; cat "$RUNNER_TEMP/out.log"; exit 1; }
          log="$HOME/Library/Application Support/org.agasthy.desktop/logs/agasthy.log"
          cat "$log"
          grep -q "start AGASTHY ${TAG#v}" "$log"
          ! grep -q " panic " "$log"
          kill "$pid"

  windows-app:
    name: Windows app (installer)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download the installer from the release
        run: |
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern "*x64-setup.exe*"
          $exe = Get-ChildItem *x64-setup.exe | Select-Object -First 1
          $expected = (Get-Content "$($exe.Name).sha256").Split(" ")[0]
          $actual = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "checksum mismatch" }
      - name: Silent install
        run: |
          $exe = Get-ChildItem *x64-setup.exe | Select-Object -First 1
          Start-Process -FilePath $exe.FullName -ArgumentList "/S" -Wait
          $app = Get-ChildItem -Path "$env:LOCALAPPDATA","$env:ProgramFiles" -Recurse -Filter "agasthy-desktop.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw "installed executable not found" }
          "APP=$($app.FullName)" | Out-File -Append $env:GITHUB_ENV
          Write-Output "Installed: $($app.FullName)"
      - name: Launch and check it started
        run: |
          $p = Start-Process -FilePath $env:APP -PassThru
          Start-Sleep -Seconds 30
          if ($p.HasExited) { throw "app exited early with code $($p.ExitCode)" }
          $log = Join-Path $env:APPDATA "org.agasthy.desktop\logs\agasthy.log"
          Get-Content $log
          $v = $env:TAG.TrimStart("v")
          if (-not (Select-String -Path $log -Pattern "start AGASTHY $v" -Quiet)) { throw "start line missing" }
          if (Select-String -Path $log -Pattern " panic " -Quiet) { throw "panic logged" }
          Stop-Process -Id $p.Id -Force
      - name: Silent uninstall
        run: |
          $u = Get-ChildItem -Path (Split-Path $env:APP) -Filter "uninstall.exe" | Select-Object -First 1
          if ($u) { Start-Process -FilePath $u.FullName -ArgumentList "/S" -Wait }

  linux-app:
    name: Linux app (AppImage and .deb)
    runs-on: ubuntu-24.04
    steps:
      - name: Download from the release
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*amd64.AppImage" --pattern "*amd64.AppImage.sha256" --pattern "*amd64.deb*"
          sha256sum -c *.AppImage.sha256 *.deb.sha256
      - name: Runtime libraries and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 libfuse2t64 || sudo apt-get install -y xvfb dbus-x11 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 libfuse2
      - name: AppImage launches and starts
        run: |
          chmod +x *.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          xvfb-run -a dbus-run-session -- ./AGASTHY_*_amd64.AppImage > out.log 2>&1 &
          sleep 40
          log="$HOME/.local/share/org.agasthy.desktop/logs/agasthy.log"
          cat out.log | tail -20 || true
          cat "$log"
          grep -q "start AGASTHY ${TAG#v}" "$log"
          ! grep -q " panic " "$log"
          pkill -f agasthy-desktop || true
      - name: .deb installs and launches
        run: |
          sudo apt-get install -y ./agasthy_*_amd64.deb
          rm -f "$HOME/.local/share/org.agasthy.desktop/logs/agasthy.log"
          bin=$(dpkg -L agasthy | grep -E "/bin/" | head -1)
          echo "binary: $bin"
          xvfb-run -a dbus-run-session -- "$bin" > out-deb.log 2>&1 &
          sleep 30
          grep -q "start AGASTHY ${TAG#v}" "$HOME/.local/share/org.agasthy.desktop/logs/agasthy.log"
          pkill -f agasthy-desktop || true

  cli:
    name: Command-line tool on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            archive: agasthy-cli-macos-aarch64.tar.gz
          - os: windows-latest
            archive: agasthy-cli-windows-x86_64.zip
          - os: ubuntu-24.04
            archive: agasthy-cli-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Download the released command-line tool
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "${{ matrix.archive }}*"
          if command -v sha256sum >/dev/null; then sha256sum -c "${{ matrix.archive }}.sha256"; else shasum -a 256 -c "${{ matrix.archive }}.sha256"; fi
          mkdir -p bin
          case "${{ matrix.archive }}" in
            *.zip) unzip -q "${{ matrix.archive }}" -d bin ;;
            *) tar -C bin -xzf "${{ matrix.archive }}" ;;
          esac
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Version matches the release
        run: test "$(agasthy --version)" = "agasthy ${TAG#v}"
      - name: Scan a real Git repository, then query it like an agent would
        run: |
          work="$HOME/agasthy-smoke/code"
          mkdir -p "$work/demo-app" && cd "$work/demo-app"
          git init -q && git config user.email ci@example.invalid && git config user.name CI
          echo '{"name":"demo-app","dependencies":{"react":"^19.0.0"}}' > package.json
          git add . && git commit -qm init
          echo "change" > notes.txt
          cd "$GITHUB_WORKSPACE"
          db="$HOME/agasthy-smoke/agasthy.db"
          py=$(command -v python3 || command -v python)
          agasthy scan "$work" --db "$db" > /dev/null
          agasthy status --db "$db"
          id=$(agasthy find demo-app --kind repository --db "$db" | "$py" -c "import json,sys; d=json.load(sys.stdin); assert d['count']==1, d; print(d['entities'][0]['id'])")
          agasthy entity "$id" --db "$db" | "$py" -c "import json,sys; d=json.load(sys.stdin); w=d['entity']['attributes']['working_tree']['value']; assert w['untracked']==1, w; print('uncommitted work found:', w)"
      - name: MCP server answers like a client expects
        run: |
          py=$(command -v python3 || command -v python)
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"find","arguments":{"text":"demo-app","kind":"repository"}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"agents","arguments":{}}}' \
            | agasthy mcp --db "$HOME/agasthy-smoke/agasthy.db" > mcp.out
          cat mcp.out | head -c 1500; echo
          "$py" - <<'PY'
          import json
          r = {m["id"]: m for m in map(json.loads, open("mcp.out"))}
          assert r[1]["result"]["serverInfo"]["name"] == "agasthy", r[1]
          tools = r[2]["result"]["tools"]
          assert len(tools) >= 9 and all(t["annotations"]["readOnlyHint"] for t in tools), tools
          found = json.loads(r[3]["result"]["content"][0]["text"])
          assert found["count"] == 1, found
          assert r[4]["result"]["isError"] is False, r[4]
          print("MCP OK:", len(tools), "read-only tools")
          PY

      - name: Live commands run cleanly
        run: |
          py=$(command -v python3 || command -v python)
          for c in agents processes telemetry usage software packages platform; do
            echo "== $c"
            agasthy $c > out.json
            "$py" -c "import json; json.load(open('out.json'))"
            head -c 400 out.json; echo
          done
